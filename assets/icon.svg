<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="foculeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="#0a0a0a"/>
  
  <!-- Inner glow ring -->
  <rect x="24" y="24" width="208" height="208" rx="40" fill="none" stroke="url(#foculeGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Stylized "F" mark with play/focus concept -->
  <g filter="url(#shadow)">
    <!-- Main F shape -->
    <path d="M80 64 L80 192 L104 192 L104 140 L152 140 L152 116 L104 116 L104 88 L168 88 L168 64 L80 64 Z" fill="url(#foculeGradient)"/>
    
    <!-- Accent dot/lens element -->
    <circle cx="176" cy="152" r="24" fill="url(#foculeGradient)"/>
  </g>
</svg>

